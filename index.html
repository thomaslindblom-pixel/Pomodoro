<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Pomodoro">
  <meta name="theme-color" content="#1c1c1e">
  <title>Pomodoro</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon-192.png">
  <style>
    :root {
      --bg: #1c1c1e;
      --fg: #f5f5f7;
      --muted: #8e8e93;
      --track: #2c2c2e;
      --accent: #ff453a;
    }
    body[data-phase="short"] { --accent: #30d158; }
    body[data-phase="long"]  { --accent: #0a84ff; }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom);
      user-select: none;
      -webkit-user-select: none;
    }
    .phase {
      font-size: 22px;
      font-weight: 600;
      color: var(--accent);
      letter-spacing: 0.02em;
      transition: color .3s;
    }
    .ring { position: relative; width: min(78vw, 340px); aspect-ratio: 1; }
    .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
    .ring circle { fill: none; stroke-width: 6; }
    .ring .track { stroke: var(--track); }
    .ring .progress {
      stroke: var(--accent);
      stroke-linecap: round;
      transition: stroke .3s;
    }
    .time {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: min(18vw, 76px);
      font-weight: 300;
      font-variant-numeric: tabular-nums;
    }
    .dots { display: flex; gap: 12px; }
    .dot {
      width: 12px; height: 12px; border-radius: 50%;
      background: var(--track);
      transition: background .3s;
    }
    .dot.done { background: #ff453a; }
    .dot.current { box-shadow: 0 0 0 2px #ff453a inset; }
    .info { color: var(--muted); font-size: 15px; text-align: center; min-height: 1.3em; }
    .controls { display: flex; gap: 20px; align-items: center; }
    button {
      font: inherit;
      border: none;
      color: var(--fg);
      background: var(--track);
      border-radius: 999px;
      cursor: pointer;
    }
    button:active { opacity: .7; }
    .main {
      width: 96px; height: 96px;
      font-size: 19px; font-weight: 600;
      background: var(--accent);
      color: #fff;
      transition: background .3s;
    }
    .small { width: 64px; height: 64px; font-size: 14px; }
  </style>
</head>
<body data-phase="work">
  <div class="phase" id="phase">Fokus</div>

  <div class="ring">
    <svg viewBox="0 0 120 120" aria-hidden="true">
      <circle class="track" cx="60" cy="60" r="54"></circle>
      <circle class="progress" id="progress" cx="60" cy="60" r="54"></circle>
    </svg>
    <div class="time" id="time">25:00</div>
  </div>

  <div class="dots" id="dots" aria-label="Arbetspass i cykeln">
    <div class="dot"></div><div class="dot"></div><div class="dot"></div>
  </div>

  <div class="info" id="info"></div>

  <div class="controls">
    <button class="small" id="reset" aria-label="Nollställ">Nollställ</button>
    <button class="main" id="toggle">Starta</button>
    <button class="small" id="skip" aria-label="Hoppa över">Hoppa</button>
  </div>

  <script src="app.js"></script>
</body>
</html>
